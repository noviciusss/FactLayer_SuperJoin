version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fact_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fact_layer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: fact_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fact_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/fact_layer
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=groq
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-20b}
      - VISION_MODEL=${VISION_MODEL:-qwen/qwen3.6-27b}
      - ADJUDICATION_MODEL=${ADJUDICATION_MODEL:-openai/gpt-oss-120b}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./delhivery:/app/delhivery:ro
      - ./india-macroeconomy:/app/india-macroeconomy:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fact_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/fact_layer
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=groq
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-20b}
      - VISION_MODEL=${VISION_MODEL:-qwen/qwen3.6-27b}
      - ADJUDICATION_MODEL=${ADJUDICATION_MODEL:-openai/gpt-oss-120b}
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
      - ./delhivery:/app/delhivery:ro
      - ./india-macroeconomy:/app/india-macroeconomy:ro

volumes:
  pgdata:
  qdrant_data:
